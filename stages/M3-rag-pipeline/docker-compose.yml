services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
# 说明：与 M1 同构。若 M1 的 Qdrant 已在运行（rag-qdrant Up），可直接复用，无需再执行本文件。
