<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>M2 基础 RAG 问答 · Java 技术知识助手</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 2rem auto; max-width: 860px; color: #222; line-height: 1.65; padding: 0 1rem; }
        h1 { font-size: 1.4rem; }
        textarea { width: 100%; box-sizing: border-box; height: 90px; padding: .6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { margin-top: .5rem; margin-right: .5rem; padding: .5rem 1.2rem; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #9db4e8; cursor: wait; }
        button.gray { background: #6b7280; }
        .card { border: 1px solid #e3e3e3; border-radius: 8px; padding: 1rem 1.25rem; margin-top: 1rem; }
        .cite { color: #6b7280; font-size: .9rem; margin-top: .75rem; border-top: 1px dashed #e5e7eb; padding-top: .5rem; }
        .err { color: #b42318; }
        hr { border: 0; border-top: 1px solid #eee; margin: .6rem 0; }
        a { color: #2563eb; }
        code { background: #f4f4f5; padding: 0 4px; border-radius: 4px; }
    </style>
</head>
<body>
<h1>M2 · 基础 RAG 问答</h1>
<p>Java 技术知识助手 — 语料解析/切片 → 百炼 embedding → Qdrant 检索 → qwen 生成，答案带引用溯源。
    <a href="/status">环境状态页</a></p>

<textarea id="q" placeholder="例如：Spring 是怎么解决循环依赖的？"></textarea><br/>
<button id="askBtn" onclick="ask()">提问</button>
<button class="gray" onclick="ingest()">（重新）入库语料</button>

<div id="out"></div>

<script>
    const out = document.getElementById('out');
    const btn = document.getElementById('askBtn');

    async function ask() {
        const q = document.getElementById('q').value.trim();
        if (!q) { out.innerHTML = '<div class="card err">请先输入问题。</div>'; return; }
        btn.disabled = true;
        out.innerHTML = '<div class="card">检索与生成中…</div>';
        try {
            const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
            let cites = '';
            if (d.citations && d.citations.length) {
                cites = '<div class="cite"><b>引用来源：</b><ol>' +
                    d.citations.map(c => '<li>' + esc(c.source) + ' #' + esc(c.heading) +
                        (c.score != null ? '（相似度 ' + Number(c.score).toFixed(3) + '）' : '') + '</li>').join('') +
                    '</ol></div>';
            }
            out.innerHTML = '<div class="card"><b>问：</b>' + esc(q) + '<hr/><div>' + esc(d.answer).replace(/\n/g, '<br/>') + '</div>' + cites + '</div>';
        } catch (e) {
            out.innerHTML = '<div class="card err">出错了：' + esc(String(e.message || e)) +
                '<br/>请确认已执行过「入库语料」，且 DASHSCOPE_API_KEY 有效。</div>';
        }
        btn.disabled = false;
    }

    async function ingest() {
        out.innerHTML = '<div class="card">语料入库中（解析 → 切片 → embedding → 写入 Qdrant）…</div>';
        try {
            const r = await fetch('/api/ingest', { method: 'POST' });
            const d = await r.json();
            if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
            out.innerHTML = '<div class="card">入库完成：文件 ' + d.files + ' 个，切片 ' + d.chunks + ' 个。</div>';
        } catch (e) {
            out.innerHTML = '<div class="card err">入库失败：' + esc(String(e.message || e)) + '</div>';
        }
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
</script>
</body>
</html>
